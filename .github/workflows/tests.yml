name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/run.sh

  guard-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tests/test-history-push.sh pushes the whole history through the pre-push.
          fetch-depth: 0
      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq
      - name: Install gitleaks 8.30.1
        # The git-guard tests skip without gitleaks; the tarball is pinned by its release checksum.
        env:
          GITLEAKS_TARBALL: gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo "$RUNNER_TEMP/$GITLEAKS_TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$GITLEAKS_TARBALL"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$GITLEAKS_TARBALL" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/$GITLEAKS_TARBALL" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run the pre-commit guard tests
        run: bash tests/test-git-guards.sh
      - name: Run the pre-push guard tests
        run: bash tests/test-pre-push.sh
      - name: Push the whole history through the pre-push
        run: bash tests/test-history-push.sh
